[package]
name = "wabbit"
version = "0.1.0"
edition.workspace = true

# build for musl


license.workspace = true

[dev-dependencies]
# The end-to-end IPC test drives the real signed-command client against
# the real server, on a real socket, through a real signature.
wabbit-ipc = { path = "../wabbit-ipc" }

[dependencies]
wabbit-common = { path = "../wabbit-common", features = ["user"] }
wabbit-policy = { path = "../wabbit-policy", default-features = false }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
env_logger = { workspace = true }
hex = "0.4"
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
rustix = { version = "1.1.4", features = ["fs", "mount", "thread"] }
binrw = "0.15.2"
bilge = "0.5.0"
procfs = { version = "0.18.0", features = ["flate2"] }
[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# Verifies a baked-in policy (`WABBIT_EMBED_POLICY`) against this build's
# compiled-in keys — see build.rs's `embed_policy` — and hashes its bytes
# into the embedded file's name (the cache-busting path).
wabbit-common = { path = "../wabbit-common" }
wabbit-policy = { path = "../wabbit-policy", default-features = false }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact dependency, but
# it's not possible to tell cargo to use `-Z build-std` to build it. We cargo-in-cargo in the build
# script to build this, but we want to teach cargo about the dependency so that cache invalidation
# works properly.
#
# Note also that https://github.com/rust-lang/cargo/issues/10593 occurs when `target = ...` is added
# to an artifact dependency; it seems possible to work around that by setting `resolver = "1"` in
# Cargo.toml in the workspace root.
#
# Finally note that *any* usage of `artifact = ...` in *any* Cargo.toml in the workspace breaks
# workflows with stable cargo; stable cargo outright refuses to load manifests that use unstable
# features.
wabbit-ebpf = { path = "../wabbit-ebpf" }


[build]
target = ["amd64-unknown-linux-musl"]

[features]
enclave = []

[[bin]]
name = "wabbit"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
